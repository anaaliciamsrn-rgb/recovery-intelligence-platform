services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rip}
      POSTGRES_DB: ${POSTGRES_DB:-recovery_intelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # Sem valor default aqui de propósito: se BUILD_TIMESTAMP não estiver
        # exportada no shell, cai no default "unknown" do próprio Dockerfile.
        BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-unknown}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-rip}:${POSTGRES_PASSWORD:-rip}@postgres:5432/${POSTGRES_DB:-recovery_intelligence}
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      # Troque por um segredo real via `.env` na raiz — nunca use este default em produção.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-troque-este-valor-por-um-segredo-forte-de-32-chars}
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_SECONDS: 2592000
      ARGON2_MEMORY_COST_KB: 19456
      ARGON2_TIME_COST: 2
      ARGON2_PARALLELISM: 1
      LOGIN_RATE_LIMIT_WINDOW_MS: 900000
      LOGIN_RATE_LIMIT_MAX_REQUESTS: 5
      ACCOUNT_LOCKOUT_THRESHOLD: 10
      ACCOUNT_LOCKOUT_DURATION_SECONDS: 900
      REFRESH_TOKEN_COOKIE_NAME: rip_refresh_token
      APP_URL: http://localhost:8080
      PASSWORD_RESET_TOKEN_TTL_SECONDS: 3600
      # Este compose não termina TLS em nenhum serviço (api e web servem HTTP
      # puro) — um cookie Secure aqui seria descartado por qualquer navegador
      # real. Troque para "true" somente quando um proxy/terminador TLS for
      # colocado na frente da API.
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
