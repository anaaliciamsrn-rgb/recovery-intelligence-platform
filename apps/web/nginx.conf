server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router controla as rotas no cliente — qualquer
    # caminho sem arquivo estático correspondente (ex.: /login, /app/perfil,
    # ou um F5 em qualquer rota) precisa cair em index.html, não em 404. Sem
    # isso, a única rota que funciona de verdade é "/".
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (Vite) podem ser cacheados de forma agressiva
    # e segura — um deploy novo gera nomes de arquivo novos, nunca reaproveita
    # um nome já cacheado com conteúdo diferente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
